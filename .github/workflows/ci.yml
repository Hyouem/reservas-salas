name: Java CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Build Maven com repetição para falhas transitórias de download
        shell: bash
        run: |
          for attempt in 1 2 3; do
            mvn -B -ntp -f backend/pom.xml clean verify > maven-build.log 2>&1 && { cat maven-build.log; exit 0; }
            cat maven-build.log
            if ! grep -Eiq '429|Too Many Requests|Connection reset|Read timed out|502 Bad Gateway|503 Service Unavailable' maven-build.log; then exit 1; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cd frontend && npm ci --no-audit --no-fund && npm run build
